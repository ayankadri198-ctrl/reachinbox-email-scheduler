# ==============================================================================
# ReachInbox – Smart Email Scheduler (Render Blueprint Specification)
# Architecture: React Static Site + Express API + BullMQ Worker + Postgres + Redis
# ==============================================================================

databases:
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox_user
    plan: free
    region: oregon

services:
  # ----------------------------------------------------------------------------
  # 1. Redis Key-Value Store (BullMQ Persistent Delayed Queue)
  # ----------------------------------------------------------------------------
  - type: redis
    name: reachinbox-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Restrict access to internal Render services only

  # ----------------------------------------------------------------------------
  # 2. Backend REST API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: reachinbox-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        fromService:
          type: static
          name: reachinbox-frontend
          property: url
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "ReachInbox Scheduler <scheduler@reachinbox.test>"
      - key: ETHEREAL_AUTO_CREATE
        value: "true"

  # ----------------------------------------------------------------------------
  # 3. Dedicated Background Worker (BullMQ Delayed Job Processor)
  # ----------------------------------------------------------------------------
  - type: worker
    name: reachinbox-worker
    runtime: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "ReachInbox Scheduler <scheduler@reachinbox.test>"
      - key: ETHEREAL_AUTO_CREATE
        value: "true"

  # ----------------------------------------------------------------------------
  # 4. Frontend Static Site (React 18 + Vite + Tailwind CSS)
  # ----------------------------------------------------------------------------
  - type: static
    name: reachinbox-frontend
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: reachinbox-backend
          property: url
      - key: VITE_API_URL
        fromService:
          type: web
          name: reachinbox-backend
          property: url
